<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K8s Island Quest — React</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/join.css" />
</head>
<body>
<div id="root"></div>

<!-- ── Engine modules (plain scripts → attach to window) ──────────────── -->
<!-- islands.js MUST load before mapScene.js (MapScene uses window.Islands) -->
<script src="src/canvas/islands.js"></script>
<script src="src/canvas/mapScene.js"></script>
<script src="src/canvas/roomScene.js"></script>
<script src="src/audio/sfx.js"></script>
<script src="src/audio/ambience.js"></script>
<script src="src/data.js"></script>
<script src="src/api.js"></script>

<!-- ── React + Babel (pinned) ─────────────────────────────────────────── -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ── React app (JSX → Babel). Order: shared helpers → components → App ── -->
<script type="text/babel" data-presets="react" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="src/state.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/icons.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/scenes.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/chrome.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/JoinView.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/MapView.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/FillBlankChallenge.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/DragMatchChallenge.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/RearrangeChallenge.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/CommandChallenge.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/RoomView.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/ResultsView.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/DashboardView.jsx"></script>
<script type="text/babel" data-presets="react" src="src/components/LobbyView.jsx"></script>
<script type="text/babel" data-presets="react" src="src/App.jsx"></script>
</body>
</html>
